<svg viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo Icon -->
  <g transform="translate(10, 15)">
    <!-- Document -->
    <rect x="0" y="5" width="22" height="30" rx="2" fill="#3B82F6" opacity="0.8"/>
    <line x1="4" y1="12" x2="18" y2="12" stroke="#E0E7FF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="17" x2="18" y2="17" stroke="#E0E7FF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="22" x2="14" y2="22" stroke="#E0E7FF" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Arrow -->
    <path d="M 25 20 L 33 20" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
    <path d="M 30 17 L 33 20 L 30 23" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Agent (Robot head) -->
    <g transform="translate(36, 8)">
      <rect x="0" y="0" width="20" height="20" rx="3" fill="#8B5CF6"/>
      <circle cx="6" cy="8" r="2.5" fill="#E0E7FF"/>
      <circle cx="14" cy="8" r="2.5" fill="#E0E7FF"/>
      <rect x="6" y="14" width="8" height="2" rx="1" fill="#E0E7FF"/>
      <rect x="3" y="-3" width="4" height="3" rx="1" fill="#8B5CF6"/>
      <rect x="13" y="-3" width="4" height="3" rx="1" fill="#8B5CF6"/>
    </g>
  </g>
  
  <!-- Text -->
  <text x="80" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#3B82F6">Doc2Agent</text>
  <text x="80" y="62" font-family="Arial, sans-serif" font-size="10" fill="#64748B" letter-spacing="1">MULTI-AGENT FRAMEWORK</text>
</svg>
