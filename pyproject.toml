[project]
name = "myagent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "ollama>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-ai>=0.0.20",
    "transformers>=4.46.0",
    "torch>=2.0.0",
    "sentencepiece>=0.2.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "chainlit>=1.0.0",
]

[project.scripts]
pdf-assistant = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "app"]
